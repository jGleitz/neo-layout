name: CI

on:
  push:
    branches: [ main, macos-v2, renovate/**, keylayout-validation-poc ]
  pull_request: { }

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  validate-keylayout:
    name: Validate generated macOS keylayouts
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Validate keylayout XML against DTD
        run: |
          for f in mac_osx_new/neo-layouts-v3.bundle/Contents/Resources/*.keylayout; do
            echo "=== Validating $f ==="
            xmllint --dtdvalid mac_osx_new/KeyboardLayout.dtd --noout "$f"
          done
      - name: Verify validator catches malformed keylayout
        run: |
          cp "mac_osx_new/neo-layouts-v3.bundle/Contents/Resources/Deutsch (Neo 2 v3).keylayout" /tmp/malformed.keylayout
          # Remove a required attribute to create a DTD violation.
          sed -i '' 's/ code="18"//' /tmp/malformed.keylayout
          if xmllint --dtdvalid mac_osx_new/KeyboardLayout.dtd --noout /tmp/malformed.keylayout 2>&1; then
            echo "::error::xmllint did not reject the malformed keylayout"
            exit 1
          fi
          echo "xmllint correctly rejected the malformed keylayout"
