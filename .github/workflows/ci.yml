name: CI

on:
  push:
    branches: [ main, macos-v2, renovate/**, keylayout-validation-poc ]
  pull_request: { }

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.7.0
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Build Validator
        run: cargo build --manifest-path mac_osx_new/keylayout-validator/Cargo.toml --release
      - name: Validate
        run: |
          ./mac_osx_new/keylayout-validator/target/release/keylayout-validator \
          --strict \
          mac_osx_new/neo-layouts-v3.bundle/Contents/Resources/
